<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Password Bocor - Neina 🌸</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: #fff0f5; color: #4a044e; min-height: 100vh; display: flex; justify-content: center; padding: 30px 15px; }
.container { max-width: 500px; width: 100%; text-align: center; }
.container h1 { font-size: 28px; }
.container > p { opacity: 0.8; margin-top: 8px; }
.box { background: white; padding: 25px; border-radius: 25px; text-align: left; margin-top: 20px; box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2); border: 2px solid #ffc0cb; }
input { width: 100%; padding: 13px; border-radius: 12px; border: 2px solid #ffc0cb; background: #fff5f7; color: #4a044e; font-size: 16px; margin: 10px 0 15px; outline: none; }
input:focus { border-color: #ec4899; }
.check-btn { width: 100%; padding: 14px; border: none; border-radius: 14px; background: linear-gradient(135deg, #ec4899, #a855f7); color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
.check-btn:hover { opacity: 0.9; }
#result { margin-top: 15px; padding: 13px; border-radius: 12px; font-weight: bold; text-align: center; line-height: 1.5; }
.safe { background: #dcfce7; color: #166534; }
.danger { background: #ffe4e6; color: #9f1239; }
.warning { background: #fef3c7; color: #92400e; }
#loading { text-align: center; margin-top: 10px; }
.hidden { display: none; }
.footer { margin-top: 15px; font-size: 12px; opacity: 0.6; }
</style>
</head>
<body>
<div class="container">
  <h1>🌸 Is Your Password Leaked? 🌸</h1>
  <p>Your password is not just a password. It's your life.</p>
  <div class="box">
    <label>Enter Your Password</label>
    <input type="password" id="passwordInput" placeholder="Type your password...">
    <button class="check-btn" onclick="checkPassword()">CEK SEKARANG 💖</button>
    <div id="loading" class="hidden">Checking... ⏳</div>
    <div id="result"></div>
  </div>
  <p class="footer">Made with 💖 by Neina | 100% Private</p>
</div>
<script>
function sha1(msg) {
  function rotl(n, s) { return (n << s) | (n >>> (32 - s)); }
  function toHex(n) { let s = ""; for (let i = 7; i >= 0; i--) { s += ((n >>> (i * 4)) & 0xF).toString(16); } return s; }
  let msgUtf8 = unescape(encodeURIComponent(msg));
  let msgLen = msgUtf8.length;
  let words = [];
  for (let i = 0; i < msgLen; i++) { words[i >> 2] |= msgUtf8.charCodeAt(i) << (24 - (i % 4) * 8); }
  words[msgLen >> 2] |= 0x80 << (24 - (msgLen % 4) * 8);
  words[((msgLen + 8 >> 6) << 4) + 15] = msgLen * 8;
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  for (let i = 0; i < words.length; i += 16) {
    let w = words.slice(i, i + 16);
    for (let j = 16; j < 80; j++) w[j] = rotl(w[j-3] ^ w[j-8] ^ w[j-14] ^ w[j-16], 1);
    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let j = 0; j < 80; j++) {
      let f, k;
      if (j < 20) { f = (b & c) | ((~b) & d); k = 0x5A827999; }
      else if (j < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (j < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      let temp = (rotl(a, 5) + f + e + k + w[j]) | 0;
      e = d; d = c; c = rotl(b, 30); b = a; a = temp;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
  }
  return (toHex(h0) + toHex(h1) + toHex(h2) + toHex(h3) + toHex(h4)).toUpperCase();
}
async function checkPassword() {
  const password = document.getElementById('passwordInput').value;
  const result = document.getElementById('result');
  const loading = document.getElementById('loading');
  if (!password) { result.className = 'warning'; result.innerText = '⚠️ Please enter password first!'; return; }
  loading.classList.remove('hidden');
  result.innerText = ''; result.className = '';
  try {
    const fullHash = sha1(password);
    const prefix = fullHash.slice(0, 5);
    const suffix = fullHash.slice(5);
    const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
    const text = await response.text();
    let count = 0;
    for (let line of text.split('\n')) {
      const [hashSuffix, num] = line.trim().split(':');
      if (hashSuffix === suffix) { count = parseInt(num); break; }
    }
    loading.classList.add('hidden');
    if (count > 0) { result.className = 'danger'; result.innerHTML = `🚨 DANGER! Found ${count.toLocaleString()} times in leaks. Change it NOW!`; }
    else { result.className = 'safe'; result.innerHTML = `✅ SAFE! Not found in known leaks. Kamu aman, Neina! 💖`; }
  } catch (e) {
    loading.classList.add('hidden');
    result.className = 'warning';
    result.innerText = '❌ Error: ' + e.message + ' - Cek internet kamu!';
  }
}
</script>
</body>
</html>
